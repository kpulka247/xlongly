<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xLongly Settings</title>
    <link rel="stylesheet" href="../styles/popup.css">
</head>

<body>
    <div class="container">
        <h1>xLongly Settings</h1>

        <div class="settings-section">
            <label for="site-select">Configure for:</label>
            <select id="site-select">
                <option value="x.com">X / Twitter</option>
                <option value="bsky.app">Bluesky</option>
            </select>
        </div>

        <div class="settings-section">
            <h2>Background Color</h2>
            <div class="color-options" id="bg-color-options">
            </div>
            <label for="custom-bg-color">Custom:</label>
            <input type="color" id="custom-bg-color" value="#000000">
        </div>

        <div class="settings-section">
            <h2>Text Color</h2>
            <div class="color-options" id="text-color-options">
            </div>
            <label for="custom-text-color">Custom:</label>
            <input type="color" id="custom-text-color" value="#ffffff">
        </div>
        <div class="settings-section" id="text-presets-minimal-section">
            <h2>Text Presets</h2>
            <div id="text-presets-minimal-list" class="presets-minimal-container">
            </div>
        </div>
        <p>
            <button id="save-button">Save Settings</button>
            <button id="reset-button">Reset to Default</button>
        </p>
        <p id="status-message"></p>
    </div>
    <div id="preset-modal-overlay" class="modal-overlay hidden">
        <div id="preset-modal-content" class="modal-content">
            <button id="preset-modal-close-button" class="modal-close-button">×</button>
            <h3 id="preset-modal-title">Preset Content</h3>
            <div id="preset-modal-text-area">
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
